<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra di Logica</title>
<style>
:root{--bg:#f3f7fb;--gr:#d9e4f1;--card:#fff;--tx:#14213d;--mu:#5b6b85;--pr:#1f3a8a;--prt:#fff;--hl:#ffe66d;--ok:#1a9d5a;--okb:#e1f6ea;--ko:#d93c3c;--kob:#fde6e6;--bd:#c9d6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2e;--gr:#1a2a47;--card:#16233d;--tx:#eaf0fb;--mu:#9fb0cc;--pr:#8fb0ff;--prt:#0f1a2e;--hl:#6b5d10;--ok:#4cd08a;--okb:#12392a;--ko:#ff7a7a;--kob:#431c1f;--bd:#2c4067}}
:root[data-theme="dark"]{--bg:#0f1a2e;--gr:#1a2a47;--card:#16233d;--tx:#eaf0fb;--mu:#9fb0cc;--pr:#8fb0ff;--prt:#0f1a2e;--hl:#6b5d10;--ok:#4cd08a;--okb:#12392a;--ko:#ff7a7a;--kob:#431c1f;--bd:#2c4067}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:24px 24px;color:var(--tx);font:17px/1.5 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
h2{font-size:20px;line-height:1.3;margin:0 0 8px}
h3{margin:22px 0 8px;font-size:18px}
p{margin:6px 0}
.mu{color:var(--mu);font-size:15px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.day{border-color:var(--pr);box-shadow:5px 5px 0 var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.p{display:block;width:100%;min-height:50px;margin-top:12px;border:0;border-radius:10px;background:var(--pr);color:var(--prt);font-weight:700;font-size:17px}
.g{background:none;border:2px solid var(--bd);border-radius:10px;min-height:44px;padding:6px 14px;margin-top:10px}
.o{display:block;width:100%;min-height:54px;margin:10px 0 0;padding:12px 14px;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:10px}
.o:active:not(:disabled){border-color:var(--pr)}
.o:disabled{opacity:1;color:var(--tx)}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.ko{border-color:var(--ko);background:var(--kob)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--mu);margin-bottom:10px}
.top .g{margin:0;min-height:38px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.ex{border-left:5px solid;padding:8px 12px;margin:16px 0 0;border-radius:4px}
.ex.y{border-color:var(--ok);background:var(--okb)}
.ex.n{border-color:var(--ko);background:var(--kob)}
.hr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.c{text-align:center}
.big{font-size:56px;font-weight:800;line-height:1;margin:8px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q={
C:[
["Tutti i gatti sono animali. Micio è un gatto. Che cosa possiamo concludere?",["Micio è un animale","Micio non è un animale","Tutti gli animali sono gatti","Non si può dire nulla"],0,"Se tutti i gatti rientrano nel gruppo degli animali, ogni gatto è anche un animale. È un sillogismo: due premesse e una conclusione obbligata."],
["Frase: «Tutti i fiori di questo giardino sono rossi». Quale scoperta la smentisce?",["Un fiore giallo nel giardino","Un fiore rosso nel giardino","Un albero verde nel giardino","Una rosa rossa fuori dal giardino"],0,"Per smentire una frase che dice «tutti» basta un solo controesempio: un fiore del giardino che non sia rosso."],
["Se piove, la strada è bagnata. La strada è bagnata. Possiamo essere certi che piove?",["Sì, perché la regola vale sempre","No, la strada può essere bagnata per altri motivi","Sì, perché la strada è bagnata","No, perché non piove mai"],1,"La regola dice solo che la pioggia bagna la strada, non che sia l’unico modo. Una strada può bagnarsi anche per un tubo rotto o per il camion lavastrade."],
["Marco è più alto di Luca, e Luca è più alto di Sara. Chi è il più basso dei tre?",["Marco","Luca","Sara","Non si può sapere"],2,"Ordine dall’alto al basso: Marco, Luca, Sara. Il confronto «più alto di» è transitivo."],
["Su un’isola i cavalieri dicono sempre la verità e i furfanti mentono sempre. Un abitante dice: «Io sono un furfante». Che cos’è?",["Un cavaliere","Un furfante","Nessuno dei due: nessun abitante può dirlo","Dipende dal giorno"],2,"Un cavaliere non può dire una bugia, e un furfante, dicendolo, direbbe la verità: impossibile. Nessun abitante dell’isola può pronunciare quella frase."],
["«Tutti dicono che questo telefono è il migliore, quindi lo è». Che errore di ragionamento c’è?",["Si ritiene vera una cosa solo perché la pensano in molti","Si usano troppi numeri","La conclusione è sempre corretta","Si parla di un oggetto e non di una persona"],0,"Che molte persone credano una cosa non la rende vera. Servono prove, test e confronti."],
["Sequenza: lunedì, mercoledì, venerdì, … Qual è il prossimo giorno?",["Sabato","Domenica","Martedì","Giovedì"],1,"Si salta sempre un giorno: lunedì, (martedì), mercoledì, (giovedì), venerdì, (sabato), domenica."],
["Un padre dice: «Se studi, prendi un bel voto». Marta non ha studiato e ha preso un bel voto. Il padre ha detto il falso?",["Sì, la frase è smentita","No, la frase non dice che cosa succede se non si studia","Sì, perché Marta ha barato","Non si può mai sapere se una frase è vera"],1,"La frase promette qualcosa solo a chi studia. Chi non studia può avere un bel voto per fortuna o per altre ragioni, senza smentire nessuno."],
["D’estate aumentano sia i gelati venduti sia i bagni al mare. Qual è la spiegazione più logica?",["Mangiare gelati costringe a fare il bagno","Il caldo fa aumentare entrambe le cose","Fare il bagno fa vendere più gelati ai negozi","Le due cose non c’entrano con la stagione"],1,"Due cose che crescono insieme non sono per forza una causa dell’altra. Qui c’è una causa comune: il caldo. Correlazione non significa causa."],
["Due porte: una porta alla libertà, l’altra al pericolo. Due guardiani: uno mente sempre, l’altro dice sempre la verità, ma non sai chi è chi. Puoi fare una sola domanda a uno dei due. Quale è la migliore?",["Qual è la porta della libertà?","Che cosa risponderebbe l’altro guardiano se gli chiedessi qual è la porta della libertà? Poi scelgo la porta opposta","Sei tu quello che mente?","Quanti anni hai?"],1,"Chiunque tu interroghi, ti indica la porta del pericolo: se è sincero riporta la bugia dell’altro, se mente falsifica la verità dell’altro. Scegli la porta opposta e sei salvo."]
],
M:[
["Sequenza: 2, 6, 18, 54, … Qual è il numero successivo?",["108","162","148","72"],1,"Ogni numero è il triplo del precedente: 54 × 3 = 162."],
["3 operai costruiscono un muro in 12 giorni. Quanti giorni servono a 6 operai, che lavorano allo stesso ritmo?",["24","9","6","3"],2,"Il doppio degli operai impiega la metà del tempo: 12 ÷ 2 = 6 giorni. È una proporzionalità inversa."],
["Sommando un numero pari e un numero dispari, che cosa si ottiene sempre?",["Un numero pari","Un numero dispari","A volte pari e a volte dispari","Zero"],1,"Esempi: 2 + 3 = 5, 4 + 7 = 11, 10 + 1 = 11. Pari + dispari dà sempre dispari."],
["Quanti numeri primi ci sono tra 1 e 20 (compresi)?",["7","8","9","10"],1,"Sono 2, 3, 5, 7, 11, 13, 17, 19: otto in tutto. Il numero 1 non è primo."],
["Il doppio di un numero, aumentato di 5, fa 21. Qual è il numero?",["8","10","13","7"],0,"2x + 5 = 21, quindi 2x = 16 e x = 8. Verifica: 2 × 8 + 5 = 21."],
["Sequenza: 1, 1, 2, 3, 5, 8, … Qual è il numero successivo?",["11","12","13","14"],2,"Ogni numero è la somma dei due precedenti (sequenza di Fibonacci): 5 + 8 = 13."],
["Una maglia da 50 € ha lo sconto del 20%. Poi sul prezzo già scontato c’è un ulteriore sconto del 10%. Quanto costa alla fine?",["35 €","36 €","40 €","30 €"],1,"Primo sconto: 50 × 0,8 = 40 €. Secondo sconto: 40 × 0,9 = 36 €. Gli sconti successivi non si sommano."],
["In una classe di 25 alunni, 15 giocano a calcio, 12 a pallavolo e 5 a entrambi. Quanti non fanno nessuno dei due sport?",["2","3","5","8"],1,"Chi fa almeno uno sport: 15 + 12 − 5 = 22 (i 5 che fanno entrambi sono stati contati due volte). Restano 25 − 22 = 3."],
["a, b, c sono numeri interi con a > b > c e c = 4. Qual è il valore minimo possibile di a?",["5","6","7","4"],1,"b deve essere maggiore di 4, quindi almeno 5; a deve essere maggiore di b, quindi almeno 6."],
["Lanci un dado equo a 6 facce. Qual è la probabilità di ottenere un numero maggiore di 4?",["1/2","1/3","1/6","2/3"],1,"I numeri maggiori di 4 sono 5 e 6: 2 casi favorevoli su 6 possibili. 2/6 = 1/3."]
],
P:[
["x = 5; poi x = x + 3; poi x = x × 2. Quanto vale x alla fine?",["8","13","16","10"],2,"Passo dopo passo: x = 5, poi 8, poi 16. Un’istruzione usa il valore che la variabile ha in quel momento."],
["somma = 0. Per i da 1 a 4: somma = somma + i. Quanto vale somma alla fine?",["4","10","15","24"],1,"1 + 2 + 3 + 4 = 10. A ogni giro del ciclo si aggiunge il valore corrente di i."],
["Che cosa controlla la condizione n % 2 == 0?",["Che n sia pari","Che n sia dispari","Che n sia zero","Che n sia negativo"],0,"L’operatore % dà il resto della divisione. Se il resto della divisione per 2 è 0, il numero è pari."],
["Quante volte viene stampato «Ciao» da: per i da 0 a 4 (compresi) stampa «Ciao»?",["4","5","6","0"],1,"I valori di i sono 0, 1, 2, 3, 4: cinque valori, quindi cinque stampe. Attenzione a contare anche lo zero."],
["Quanto vale (VERO AND FALSO) OR VERO?",["Vero","Falso","Errore","Dipende"],0,"VERO AND FALSO dà FALSO, perché AND richiede entrambi veri. FALSO OR VERO dà VERO, perché OR ne richiede almeno uno."],
["a = 3 e b = 7. Si esegue: temp = a; a = b; b = temp. Quali valori hanno a e b?",["a = 7 e b = 3","a = 3 e b = 7","a = 7 e b = 7","a = 3 e b = 3"],0,"temp conserva il 3, poi a prende il 7 e infine b prende il 3 salvato in temp. È lo scambio classico di due variabili."],
["x = 1. Finché x > 0: x = x + 1. Che cosa succede?",["Il ciclo non finisce mai","Si ferma quando x vale 10","Si ferma subito","x diventa negativo"],0,"x parte da 1 e cresce sempre, quindi x > 0 resta vera per sempre. È un ciclo infinito."],
["Lista [4, 9, 2, 7]. Si parte con max = 4 e per ogni elemento, se è maggiore di max, max prende quel valore. Quanto vale max alla fine?",["4","7","9","2"],2,"Il confronto aggiorna max così: 4, poi 9 (9 > 4), poi resta 9 con 2 e 7. Alla fine max = 9."],
["x = 10. Se x > 5 stampa A, altrimenti se x > 8 stampa B. Che cosa viene stampato?",["A","B","A e B","Niente"],0,"La prima condizione è vera, quindi si esegue solo quel ramo. Il ramo «altrimenti se» non viene nemmeno controllato."],
["Quanto vale 17 % 5 (resto della divisione)?",["3","2","3,4","12"],1,"17 ÷ 5 fa 3 con il resto di 2, perché 5 × 3 = 15 e 17 − 15 = 2."]
]};
const N={C:"Logica critica",M:"Logica e matematica",P:"Logica e programmazione",D:"Quiz del giorno"};
const I={C:"🔍",M:"➗",P:"💻"};
const D={C:"Deduzioni, ragionamenti, errori di logica ed enigmi di tutti i giorni.",M:"Sequenze, proporzioni, probabilità ed equazioni da risolvere con la testa.",P:"Variabili, cicli, condizioni e operatori: pensa come un computer."};
const $=s=>document.querySelector(s),A=$("#app"),K="lq_v1";
let S,pend=null;
function ld(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
if(!S||typeof S!=="object")S={};S.h=S.h||[];S.b=S.b||{};S.d=S.d||{};S.x=S.x||null}
function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function hs(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(){let n=0,d=new Date();if(!S.d[ds(d)])d.setDate(d.getDate()-1);while(S.d[ds(d)]){n++;d.setDate(d.getDate()-1)}return n}
function start(m){const day=ds(new Date()),r=m==="D"?rng(hs("d"+day)):rng(Date.now()),cats=m==="D"?["C","M","P"]:[m];
let it=[];cats.forEach(c=>Q[c].forEach((q,i)=>it.push([c,i,sh([0,1,2,3],r)])));
S.x={m,day,it:sh(it,r),i:0,s:0};sv();quiz()}
function quiz(){const x=S.x;if(!x)return home();if(x.i>=x.it.length)return fin();
const [c,qi,p]=x.it[x.i],q=Q[c][qi];pend=null;
A.innerHTML=`<div class="w"><div class="top"><button class="g" onclick="home()">Esci</button><span>${x.i+1} di ${x.it.length}</span><span>${N[c]}</span></div><div class="bar"><i style="width:${x.i/x.it.length*100}%"></i></div><div class="card"><h2>${q[0]}</h2>${p.map((k,j)=>`<button class="o" onclick="ans(${j})">${q[1][k]}</button>`).join("")}<div id="fb"></div></div></div>`;
window.scrollTo(0,0)}
function ans(j){if(pend)return;const x=S.x,[c,qi,p]=x.it[x.i],q=Q[c][qi],ok=p[j]===q[2],cj=p.indexOf(q[2]);pend={ok};
A.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(k===cj)b.classList.add("ok");else if(k===j)b.classList.add("ko")});
$("#fb").innerHTML=`<p class="ex ${ok?"y":"n"}"><b>${ok?"Giusto! ✅":"Sbagliato ❌"}</b><br>${q[3]}</p><button class="p" onclick="nx()">${x.i+1<x.it.length?"Domanda successiva":"Vedi il risultato"}</button>`;
$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function nx(){const x=S.x;if(pend&&pend.ok)x.s++;x.i++;sv();quiz()}
function fin(){const x=S.x,t=x.it.length,pc=Math.round(x.s/t*100);
S.h.unshift({d:x.day,m:x.m,s:x.s,t});S.h=S.h.slice(0,30);
if(S.b[x.m]==null||pc>S.b[x.m])S.b[x.m]=pc;
if(x.m==="D"&&!S.d[x.day])S.d[x.day]={s:x.s,t};
S.x=null;sv();
const msg=pc>=90?"Fantastico! Ragioni da campione 🏆":pc>=70?"Ottimo lavoro! 💪":pc>=50?"Buon inizio: rileggi le spiegazioni 📚":"Allenati ancora: ogni errore insegna qualcosa 🌱";
A.innerHTML=`<div class="w"><div class="card c"><h2>${N[x.m]}</h2><div class="big">${x.s}/${t}</div><p><b>${pc}%</b></p><p>${msg}</p><button class="p" onclick="start('${x.m}')">Riprova</button><button class="g" onclick="home()">Torna alla home</button></div></div>`;window.scrollTo(0,0)}
function home(){const dn=S.d[ds(new Date())],st=streak(),x=S.x;
A.innerHTML=`<div class="w"><h1>🧠 Palestra di <span>Logica</span></h1><p class="mu">Allena il ragionamento un po’ ogni giorno. I tuoi progressi restano salvati su questo telefono.</p>
<div class="row"><span class="chip">🔥 Serie: ${st} ${st===1?"giorno":"giorni"}</span><span class="chip">✅ Quiz del giorno fatti: ${Object.keys(S.d).length}</span></div>
${x?`<div class="card"><h2>Quiz in corso</h2><p class="mu">${N[x.m]} · domanda ${x.i+1} di ${x.it.length}</p><button class="p" onclick="quiz()">Riprendi</button></div>`:""}
<div class="card day"><h2>📅 Quiz del giorno</h2><p>30 domande che mescolano logica critica, matematica e programmazione. Ogni giorno l’ordine cambia.</p>${dn?`<p><b>Oggi hai fatto ${dn.s} su ${dn.t}.</b></p>`:""}<button class="p" onclick="start('D')">${dn?"Rifai per allenarti":"Inizia il quiz di oggi"}</button></div>
${["C","M","P"].map(c=>`<div class="card"><h2>${I[c]} ${N[c]}</h2><p class="mu">${D[c]}</p><p class="mu">10 domande · Record: ${S.b[c]!=null?S.b[c]+"%":"nessuno"}</p><button class="p" onclick="start('${c}')">Allenati</button></div>`).join("")}
<h3>Ultimi quiz</h3>${S.h.length?S.h.slice(0,6).map(h=>`<div class="hr"><span>${h.d} · ${N[h.m]}</span><b>${h.s}/${h.t}</b></div>`).join(""):`<p class="mu">Non hai ancora completato nessun quiz.</p>`}
<button class="g" onclick="rs()">Cancella tutti i dati</button></div>`;window.scrollTo(0,0)}
function rs(){if(confirm("Vuoi davvero cancellare tutti i progressi?")){try{localStorage.removeItem(K)}catch(e){}S={h:[],b:{},d:{},x:null};home()}}
ld();home();
</script>
</body>
</html>
